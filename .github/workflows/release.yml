name: Release

# A v* tag: check, build the installer and put it in a draft GitHub Release.
# Run by hand (workflow_dispatch): check and build only; the installer is an artifact.
# Decisions: docs/decisions/0020. Actions are pinned to commit SHAs (the tag is in the comment).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Tag of a checked draft to publish (v1.2.3); leave empty to build only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.publish }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --group build
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: uv run --project backend python scripts/check.py

      # The runner has Inno Setup 6; the build needs the 7.1.1 it was made with.
      - name: Install Inno Setup 7.1.1
        run: |
          $file = "$env:RUNNER_TEMP\innosetup-7.1.1-x64.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          if ($hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw "Inno Setup checksum mismatch: $hash" }
          Start-Process $file -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe")) { throw 'ISCC.exe not found after installing Inno Setup' }

      # build_installer.py fails unless packaging/output holds only the installer and its
      # .sha256 and the installer has no test marker; on a tag, the tag must be v<__version__>.
      - name: Build the installer
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            uv run --project backend python scripts/build_installer.py --release-tag $env:GITHUB_REF_NAME
          } else {
            uv run --project backend python scripts/build_installer.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: packaging/output/
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dist
      # A draft: the author checks it and publishes it by hand. A pre-release version
      # (1.0.0-rc.N) is marked as one, so releases/latest never offers it to the app.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="MediaDownloader-Setup-$version.exe"
          [ "$(ls dist | sort)" = "$(printf '%s\n' "$installer" "$installer.sha256")" ] || { ls dist; exit 1; }
          (cd dist && sha256sum -c "$installer.sha256")
          flags=(--draft --verify-tag --title "$GITHUB_REF_NAME" --notes "")
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" "dist/$installer" "dist/$installer.sha256"

  # Publishing through the API (ADR 0022): the web form's "Publish release" dropped both
  # files from v1.0.0, and an immutable release can't get them back.
  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.publish }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $TAG"; exit 1; }
          version="${TAG#v}"
          expected="$(printf '%s\n' "MediaDownloader-Setup-$version.exe" "MediaDownloader-Setup-$version.exe.sha256")"
          files() { gh release view "$TAG" --json assets --jq '.assets[].name' | sort; }
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ] || { echo "$TAG is not a draft"; exit 1; }
          [ "$(files)" = "$expected" ] || { echo "the draft doesn't hold exactly the two files:"; files; exit 1; }
          gh release edit "$TAG" --draft=false
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false ] || exit 1
          [ "$(files)" = "$expected" ] || { echo "published, but the files changed:"; files; exit 1; }
          gh release view "$TAG" --json tagName,isPrerelease,assets --jq '{tagName, isPrerelease, assets: [.assets[] | {name, size}]}'
