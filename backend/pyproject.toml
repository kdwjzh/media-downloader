[project]
name = "media-downloader"
version = "1.0.0"
description = "Windows desktop downloader for music and video"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=6.2.1",
    "truststore>=0.10.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
